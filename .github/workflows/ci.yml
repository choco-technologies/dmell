name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, feature/**, copilot/** ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: chocotechnologies/dmod:1.0.4
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build dmell project
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .
      
      - name: Build and run unit tests
        run: |
          mkdir -p build-tests
          cd build-tests
          # Tests are real dmod_add_test() modules (see tests/), sharing the
          # same DMOD_MODE=DMOD_MODULE linking model as dmell's own library
          # modules - not a separate host-native/gtest build. They must be
          # built for the runner's own architecture so dmod_loader can
          # actually execute them.
          cmake .. -DDMOD_TOOLS_NAME=arch/x86_64 -DDMELL_BUILD_TESTS=ON
          cmake --build .
          ctest --output-on-failure
